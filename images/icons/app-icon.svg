<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff6fa5"/>
      <stop offset="50%" stop-color="#9b5de5"/>
      <stop offset="100%" stop-color="#4cc9f0"/>
    </linearGradient>
  </defs>

  <!-- Full-bleed background; iOS applies its own corner mask, so this
       stays a plain square per Apple's touch-icon guidance. -->
  <rect x="0" y="0" width="512" height="512" fill="url(#bg)"/>

  <!-- Sparkles -->
  <g fill="#ffffff">
    <path d="M 118 98 L 130 138 L 170 150 L 130 162 L 118 202 L 106 162 L 66 150 L 106 138 Z" opacity="0.95"/>
    <path d="M 388 150 L 396 176 L 422 184 L 396 192 L 388 218 L 380 192 L 354 184 L 380 176 Z" opacity="0.9"/>
    <path d="M 330 90 L 336 108 L 354 114 L 336 120 L 330 138 L 324 120 L 306 114 L 324 108 Z" opacity="0.85"/>
  </g>

  <!-- Rainbow -->
  <g fill="none" stroke-linecap="round">
    <path d="M 86 400 A 170 170 0 0 1 426 400" stroke="#ffffff" stroke-width="34"/>
    <path d="M 128 400 A 128 128 0 0 1 384 400" stroke="#fff1a8" stroke-width="30"/>
    <path d="M 166 400 A 90 90 0 0 1 346 400" stroke="#ffb4c6" stroke-width="30"/>
    <path d="M 204 400 A 52 52 0 0 1 308 400" stroke="#a6e3ff" stroke-width="30"/>
  </g>

  <!-- Cloud puffs at the rainbow's feet -->
  <g fill="#ffffff">
    <circle cx="86" cy="400" r="30"/>
    <circle cx="60" cy="412" r="22"/>
    <circle cx="426" cy="400" r="30"/>
    <circle cx="452" cy="412" r="22"/>
  </g>
</svg>
